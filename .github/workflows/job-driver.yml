# Job Application Driver · permanent runner workflow · v1.0.6 · 14 Oct 2026 · v1.0.6: runs every 2 hours (was 15 min, your call 14 Oct); work and wait split into two jobs so a code push is not stuck behind the wait; "newest run owns the loop" guard; GROQ_API_KEY passed to the runner. v1.0.4: self-chaining (GitHub never fired the cron schedule). v1.0.2: cron off the hour. v1.0.1: Node 24 actions.
# Secrets live in GitHub (Settings -> Secrets and variables -> Actions). Without them the runner falls back to a dry run on fixtures.
# To stop the loop: Actions -> job-driver -> "..." -> Disable workflow. To restart: enable it, then Run workflow with mode=run and chain=true.
# To change the gap: edit CHAIN_EVERY_S below (seconds) and keep the chain job's timeout-minutes above it.
name: job-driver
run-name: "job-driver ${{ inputs.mode || github.event_name }} chain=${{ inputs.chain }}"

on:
  schedule:
    - cron: "4 */2 * * *"   # safety net only (GitHub has not fired it so far); the chain does the regular work
    - cron: "6 16 * * *"    # 21:36 IST nightly (runner also catches up nightly in the first run after 21:36 IST)
  workflow_dispatch:
    inputs:
      mode:
        description: run | nightly | verify
        default: verify
        type: choice
        options: [run, nightly, verify]
      dry_run:
        description: dry run on fixtures, write nothing
        type: boolean
        default: false
      chain:
        description: start the next run ~2 hours later (keeps the loop going)
        type: boolean
        default: false
  push:
    paths:
      - "runner/**"
      - ".github/workflows/job-driver.yml"

permissions:
  contents: read
  actions: write   # lets GitHub's built-in token start the next run (workflow_dispatch)

jobs:
  driver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: job-driver-work
      cancel-in-progress: false
    outputs:
      chain: ${{ steps.mode.outputs.chain }}
      start: ${{ steps.start.outputs.t }}
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SUPABASE_URL: https://bxzmneeacjjtwmtdsrjd.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Note start time
        id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            [ "${{ github.event.inputs.dry_run }}" = "true" ] && echo "flag=--dry-run" >> "$GITHUB_OUTPUT" || echo "flag=" >> "$GITHUB_OUTPUT"
            [ "${{ github.event.inputs.chain }}" = "true" ] && echo "chain=yes" >> "$GITHUB_OUTPUT" || echo "chain=no" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"; echo "flag=--dry-run" >> "$GITHUB_OUTPUT"; echo "chain=yes" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "6 16 * * *" ]; then
            echo "mode=nightly" >> "$GITHUB_OUTPUT"; echo "flag=" >> "$GITHUB_OUTPUT"; echo "chain=yes" >> "$GITHUB_OUTPUT"
          else
            echo "mode=run" >> "$GITHUB_OUTPUT"; echo "flag=" >> "$GITHUB_OUTPUT"; echo "chain=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Run
        run: python runner/job_driver_runner.py ${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.flag }}

  chain:
    # Waits, then starts the next run. push = code test: hand off only if the dry run passed; otherwise hand off even if the run had errors.
    needs: driver
    if: ${{ always() && needs.driver.outputs.chain == 'yes' && (github.event_name != 'push' || needs.driver.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHAIN_EVERY_S: "7200"
    steps:
      - name: Wait, then start the next run
        run: |
          start="${{ needs.driver.outputs.start }}"; [ -z "$start" ] && start=$(date +%s)
          wait=$(( CHAIN_EVERY_S - ( $(date +%s) - start ) - 60 ))
          if [ "$wait" -gt 0 ]; then echo "waiting ${wait}s so runs stay ~2 h apart"; sleep "$wait"; fi
          # Newest run owns the loop: if a newer run that chains is queued or running, it starts the next one, so this run steps aside.
          newer=$(gh run list --workflow job-driver.yml --limit 30 --json databaseId,status,displayTitle \
            --jq "[.[] | select(.databaseId > ${{ github.run_id }}) | select(.status != \"completed\") | select(.displayTitle | contains(\"chain=false\") | not)] | length")
          if [ "${newer:-0}" -gt 0 ]; then
            echo "a newer run ($newer) owns the loop; not starting another"
          else
            gh workflow run job-driver.yml --ref "${{ github.ref_name }}" -f mode=run -f dry_run=false -f chain=true
            echo "next run started"
          fi
